name: Feature Request
description: Suggest a new feature or enhancement for SVM Analyst
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an improvement. Please describe your idea clearly so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: Is your feature request related to a problem? Describe what you are trying to do that you cannot do today.
      placeholder: "I find it frustrating that I cannot … / It would be useful to see …"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you would like and how it should work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches you have considered or tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, related papers, or any other context that helps understand the request.
