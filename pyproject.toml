[project]
name = "svm-analyst"
version = "1.0.2"
description = "Interactive PWM/SVM modulation simulator for educational use."
authors = [
  { name = "Amine KHETTAT" }
]
readme = "README.md"
requires-python = ">=3.10"

[project.dependencies]
numpy = "*"
scipy = "*"
matplotlib = "*"
PySide6 = "*"
pyqtgraph = "*"
PyPDF2 = "*"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
qt_api = "pyside6"

[tool.black]
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
